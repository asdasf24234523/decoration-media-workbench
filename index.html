<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>装修新媒体协同工作台</title>
<script src="lib/xlsx-js-style.min.js"></script>


<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f6fa; color: #1f2329; font-size: 14px; }
  header { background: linear-gradient(90deg,#3b6cf6,#5b8def); color:#fff; padding: 14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .hint { font-size: 12px; opacity: .85; }
  header .user-box { display:flex; align-items:center; gap:12px; font-size:13px; }
  header .user-box .avatar { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; font-weight:600; }
  header .user-box button { background:rgba(255,255,255,.2); color:#fff; border:1px solid rgba(255,255,255,.4); padding:4px 12px; border-radius:6px; cursor:pointer; font-size:12px; }
  header .user-box button:hover { background:rgba(255,255,255,.3); }
  nav { display:flex; background:#fff; border-bottom:1px solid #e5e8ef; padding: 0 16px; flex-wrap:wrap; }
  nav button { background:none; border:none; padding: 14px 18px; cursor:pointer; font-size:14px; color:#4e5969; border-bottom:2px solid transparent; }
  nav button:hover { color:#3b6cf6; }
  nav button.active { color:#3b6cf6; border-bottom-color:#3b6cf6; font-weight:600; }
  main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
  .card { background:#fff; border-radius:10px; padding:18px; margin-bottom:18px; box-shadow:0 1px 4px rgba(0,0,0,.04); }
  .card h2 { font-size:15px; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  label { font-size:13px; color:#4e5969; }
  input, select, textarea { font-family:inherit; font-size:14px; padding:7px 10px; border:1px solid #d6dae4; border-radius:6px; outline:none; background:#fff; }
  input:focus, select:focus, textarea:focus { border-color:#3b6cf6; }
  textarea { width:100%; min-height:60px; resize:vertical; }
  button.btn { background:#3b6cf6; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:14px; }
  button.btn:hover { background:#2f5ad6; }
  button.btn:disabled { background:#c9cdd9; cursor:not-allowed; }
  button.btn.ghost { background:#fff; color:#3b6cf6; border:1px solid #3b6cf6; }
  button.btn.ghost:hover { background:#eef3ff; }
  button.btn.sm { padding:4px 10px; font-size:12px; }
  button.btn.danger { background:#f53f3f; }
  button.btn.danger:hover { background:#d62b2b; }
  button.btn.green { background:#00b42a; }
  button.btn.green:hover { background:#009a22; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { border:1px solid #e5e8ef; padding:8px 10px; text-align:left; vertical-align:top; }
  th { background:#f2f4f9; font-weight:600; color:#1f2329; }
  tr:hover td { background:#fafbff; }
  .pill { display:inline-block; padding:2px 9px; border-radius:11px; font-size:12px; white-space:nowrap; }
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
  .stat { background:#f7f9ff; border:1px solid #e6ecff; border-radius:10px; padding:16px; }
  .stat .n { font-size:24px; font-weight:700; color:#3b6cf6; }
  .stat .l { font-size:12px; color:#86909c; margin-top:4px; }
  .recon { margin-top:8px; }
  .recon .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #eee; }
  .ok { color:#00b42a; } .bad { color:#f53f3f; }
  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow:auto; }
  .modal-mask.show { display:flex; }
  .modal { background:#fff; border-radius:12px; width:560px; max-width:100%; padding:22px; }
  .modal h3 { margin-bottom:16px; font-size:16px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-grid .full { grid-column:1/3; }
  .form-grid label { display:block; margin-bottom:5px; color:#4e5969; }
  .form-grid input, .form-grid select, .form-grid textarea { width:100%; }
  .chk { display:inline-flex; align-items:center; gap:4px; margin-right:12px; font-size:13px; }
  .modal-foot { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  .follow-item { border-left:3px solid #3b6cf6; padding:8px 12px; margin:8px 0; background:#f7f9ff; border-radius:0 8px 8px 0; }
  .follow-item .meta { font-size:12px; color:#86909c; margin-bottom:3px; }
  .field-list { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; max-height:220px; overflow:auto; padding:6px; border:1px solid #eee; border-radius:8px; }
  .field-list label { display:flex; align-items:center; gap:6px; font-size:13px; }
  .empty { text-align:center; color:#a9b0bd; padding:30px; }
  .muted { color:#86909c; font-size:12px; }
  .note { background:#fff8e8; border:1px solid #ffe1a8; color:#8a6d1b; padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; }
  .period-tabs { display:flex; gap:8px; margin-bottom:14px; }
  .period-tabs button { padding:6px 14px; border:1px solid #d6dae4; border-radius:6px; background:#fff; cursor:pointer; font-size:13px; }
  .period-tabs button.active { background:#3b6cf6; color:#fff; border-color:#3b6cf6; }
  .cat-tag { display:inline-block; padding:1px 7px; border-radius:4px; font-size:11px; background:#e6ecff; color:#3b6cf6; margin:1px 2px; }
  .section-title { font-size:14px; font-weight:600; color:#1f2329; margin:20px 0 10px; padding-bottom:6px; border-bottom:2px solid #3b6cf6; }
  .drop-zone { border:2px dashed #3b6cf6; border-radius:10px; padding:40px 20px; text-align:center; color:#3b6cf6; cursor:pointer; transition:.2s; background:#f7f9ff; }
  .drop-zone:hover, .drop-zone.dragover { background:#eef3ff; border-color:#2f5ad6; }
  .drop-zone .dz-icon { font-size:32px; margin-bottom:8px; }
  .drop-zone input[type=file] { display:none; }
  .import-preview { margin-top:16px; border:1px solid #e5e8ef; border-radius:8px; overflow:hidden; }
  .import-preview table { font-size:12px; }
  .import-badge { display:inline-block; padding:3px 10px; border-radius:10px; font-size:12px; background:#e6ecff; color:#3b6cf6; font-weight:600; }
  .import-ok { background:#e8fff3; color:#00b42a; }
  .import-warn { background:#fff7e8; color:#ff7d00; }

  /* 登录页 */
  .login-mask { position:fixed; inset:0; background:linear-gradient(135deg,#3b6cf6 0%,#5b8def 100%); display:flex; align-items:center; justify-content:center; z-index:100; }
  .login-box { background:#fff; border-radius:16px; width:380px; padding:32px; box-shadow:0 10px 40px rgba(0,0,0,.2); }
  .login-box h1 { font-size:20px; text-align:center; margin-bottom:8px; }
  .login-box .sub { text-align:center; color:#86909c; font-size:13px; margin-bottom:24px; }
  .login-box label { display:block; margin-bottom:6px; font-size:13px; }
  .login-box input { width:100%; padding:10px 12px; font-size:14px; margin-bottom:14px; }
  .login-box button { width:100%; padding:11px; font-size:15px; }
  .login-box .err { color:#f53f3f; font-size:13px; text-align:center; margin-top:10px; min-height:18px; }
  .login-box .tip { margin-top:16px; padding:10px; background:#f7f9ff; border-radius:8px; font-size:12px; color:#4e5969; }

  .role-tag { display:inline-block; padding:1px 7px; border-radius:4px; font-size:11px; background:rgba(255,255,255,.25); margin-left:6px; }

  /* ===== 移动端适配 ===== */
  @media (max-width: 768px) {
    header { padding:10px 14px; }
    header h1 { font-size:15px; }
    header .hint { display:none; }
    header .user-box { font-size:11px; gap:8px; }
    header .user-box .avatar { width:26px; height:26px; }
    header .user-box button { padding:4px 9px; }
    nav { padding:0 6px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    nav button { padding:12px 13px; font-size:13px; white-space:nowrap; }
    main { padding:14px 12px; }
    .card { padding:14px 12px; border-radius:8px; }
    .card h2 { font-size:14px; }
    .toolbar { flex-direction:column; align-items:stretch; }
    .toolbar input, .toolbar select, .toolbar button { width:100%; }
    .form-grid { grid-template-columns:1fr; gap:12px; }
    .form-grid .full { grid-column:1/2; }
    .field-list { grid-template-columns:1fr 1fr; }
    .stats-grid { grid-template-columns:repeat(2,1fr); gap:10px; }
    .stat { padding:12px; }
    .stat .n { font-size:20px; }
    .period-tabs { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .period-tabs button { white-space:nowrap; }
    .modal { padding:16px; border-radius:10px; }
    .modal-foot { flex-direction:column; }
    .modal-foot button { width:100%; }
    /* 表格横向可滚动，避免溢出挤压 */
    main table { display:block; width:100%; overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch; }
    main table th, main table td { white-space:nowrap; }
  }
  @media (max-width: 480px) {
    .stats-grid { grid-template-columns:1fr; }
    .field-list { grid-template-columns:1fr; }
    header h1 { font-size:13px; }
  }
</style>
</head>
<body>
<div class="login-mask" id="loginMask" style="display:none">
  <div class="login-box">
    <h1>装修新媒体协同工作台</h1>
    <div class="sub">多人协同 · 数据互通</div>
    <label>用户名</label>
    <input type="text" id="loginUser" placeholder="请输入账号" autocomplete="username">
    <label>密码</label>
    <input type="password" id="loginPass" placeholder="请输入密码" autocomplete="current-password">
    <button class="btn" id="loginBtn" onclick="doLogin()">登录</button>
    <div class="err" id="loginErr"></div>
    <div class="tip">默认管理员账号：admin / admin123<br>请联系管理员开通账号</div>
  </div>
</div>

<header id="appHeader" style="display:none">
  <h1>装修新媒体部门协同工作台</h1>
  <div class="user-box">
    <div class="avatar" id="userAvatar">U</div>
    <div>
      <div id="userName">未登录</div>
      <div style="opacity:.85;font-size:11px" id="userRole"></div>
    </div>
    <button onclick="openChangePwd()">修改密码</button>
    <button onclick="doLogout()">退出</button>
  </div>
</header>
<nav id="nav">
  <button data-tab="sv" data-roles="admin,supervisor,operator,viewer">短视频记录</button>
  <button data-tab="live" data-roles="admin,supervisor,operator,viewer">直播与投流</button>
  <button data-tab="leads" data-roles="admin,supervisor,operator,salesman,viewer">客资线索库</button>
  <button data-tab="my" data-roles="admin,supervisor,operator,salesman,viewer">我的客资</button>
  <button data-tab="periodic" data-roles="admin,supervisor,operator,viewer">周期汇总</button>
  <button data-tab="dash" data-roles="admin,supervisor,operator,viewer">数据看板</button>
  <button data-tab="export" data-roles="admin,supervisor,operator,viewer">导入导出</button>
  <button data-tab="staff" data-roles="admin,supervisor">人员管理</button>
  <button data-tab="log" data-roles="admin,supervisor">操作日志</button>
</nav>
<main id="main"></main>

<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script>
const PLATFORMS = [
  {v:'douyin', l:'抖音'}, {v:'weixinv', l:'视频号'}, {v:'kuaishou', l:'快手'},
  {v:'xiaohongshu', l:'小红书'}, {v:'bilibili', l:'B站'}
];
const STATUS = [
  {v:'pending_contact', l:'待联系'}, {v:'contacted', l:'已联系'},
  {v:'in_communication', l:'沟通中'}, {v:'house_measuring', l:'上门量房'},
  {v:'plan_discussion', l:'方案对接'}, {v:'deal_closed', l:'已成交'},
  {v:'churned', l:'流失'},
  {v:'invalid', l:'无效线索'}
];
const STATUS_COLOR = {
  pending_contact:'#f2f3f5', contacted:'#e8f3ff', in_communication:'#fff7e8',
  house_measuring:'#e8ffea', plan_discussion:'#e8fff3', deal_closed:'#ffece8', churned:'#f2f3f5', invalid:'#fde2e2'
};
const VIDEO_CATEGORIES = [
  {v:'brand', l:'品牌宣传'},
  {v:'marketing', l:'营销类'},
  {v:'persona', l:'人设类'},
  {v:'knowledge', l:'干货类'},
  {v:'trust', l:'业主信任类'},
  {v:'complete', l:'完工类'},
  {v:'start', l:'开工类'},
  {v:'viral', l:'破流类'},
];
const LEAD_FORMS = [
  {v:'component', l:'留资组件'},
  {v:'groupbuy', l:'团购'},
  {v:'dm', l:'私信留资'},
];
function leadFormLabel(v){ return (LEAD_FORMS.find(c=>c.v===v)||{}).l||v||'—'; }
const LEAD_SOURCE_LABELS = {
  short_video:'短视频流量', live_stream:'直播间流量', offline:'线下拓展', other:'其他'
};
const VISIT_STATUS = [
  {v:'none', l:'未进店'}, {v:'first', l:'一访'}, {v:'second', l:'二访'}, {v:'multi', l:'多访'}
];
function visitStatusLabel(v){ return (VISIT_STATUS.find(x=>x.v===v)||{}).l||v||'—'; }
function contactDisplay(r){
  const v = r.customer_phone||'';
  if(!v) return '—';
  return (r.contact_type==='wechat'?'微信:':'电话:') + v;
}
// 直播+投流合并后，单条直播记录的消耗/获资聚合
function liveTotalSpend(r){ return (Number(r.sv_spend)||0)+(Number(r.live_spend)||0)+(Number(r.omni_spend)||0)+(Number(r.mobile_live_spend)||0); }
function liveTotalLeads(r){ return (Number(r.live_leads)||0)+(Number(r.sv_leads)||0); }
const MODULES = {
  short_video: {
    name:'短视频每日记录', store:'wb_sv', dateKey:'record_date',
    fields:[
      {key:'record_date', label:'日期', type:'date'},
      {key:'platforms', label:'发布平台', type:'platforms'},
      {key:'video_category', label:'视频种类', type:'category'},
      {key:'operator', label:'发布人', type:'text'},
      {key:'account', label:'发布账号', type:'text'},
      {key:'video_count', label:'发布视频数量', type:'number'},
      {key:'ad_spend', label:'视频投流消耗(元)', type:'number'},
      {key:'leads_count', label:'客资线索数量', type:'number'},
      {key:'lead_form', label:'获资形式', type:'leadform'},
      {key:'lead_cost', label:'获资成本(元/客资)', type:'computed',
       refKeys:['ad_spend','leads_count'],
       compute:r=>r.leads_count>0?r.ad_spend/r.leads_count:null},
      {key:'remark', label:'备注', type:'text'},
    ]
  },
  live: {
    name:'直播间与投流记录', store:'wb_live', dateKey:'live_date',
    fields:[
      {key:'live_date', label:'直播日期', type:'datetime-local'},
      {key:'session_number', label:'直播场次', type:'select', options:['早上','中午','下午','晚上']},
      {key:'host', label:'主播', type:'text'},
      {key:'duration_minutes', label:'直播时长(小时)', type:'number'},
      {key:'sv_spend', label:'短视频消耗(元)', type:'number'},
      {key:'live_spend', label:'直播消耗(项目报表)(元)', type:'number'},
      {key:'omni_spend', label:'全域投放消耗(元)', type:'number'},
      {key:'mobile_live_spend', label:'手机端直播消耗(元)', type:'number'},
      {key:'omni_deal_amount', label:'全域成交金额(元)', type:'number'},
      {key:'omni_deal_count', label:'全域成交数', type:'number'},
      {key:'live_leads', label:'直播获资', type:'number'},
      {key:'sv_leads', label:'短视频获资', type:'number'},
      {key:'total_spend', label:'总消耗(元)', type:'computed',
       refKeys:['sv_spend','live_spend','omni_spend','mobile_live_spend'],
       compute:r=>Number(r.sv_spend||0)+Number(r.live_spend||0)+Number(r.omni_spend||0)+Number(r.mobile_live_spend||0)},
      {key:'live_cpl', label:'直播获资成本(元)', type:'computed',
       refKeys:['live_spend','live_leads'],
       compute:r=>r.live_leads>0?r.live_spend/r.live_leads:null},
      {key:'sv_cpl', label:'视频获资成本(元)', type:'computed',
       refKeys:['sv_spend','sv_leads'],
       compute:r=>r.sv_leads>0?r.sv_spend/r.sv_leads:null},
      {key:'conversion_rate', label:'转化率', type:'computed',
       refKeys:['omni_deal_count','live_leads','sv_leads'],
       compute:r=>liveTotalLeads(r)>0?Number(r.omni_deal_count||0)/liveTotalLeads(r):null},
      {key:'remark', label:'备注', type:'text'},
    ]
  },
  leads: {
    name:'客资线索库', store:'wb_leads', dateKey:'get_date',
    fields:[
      {key:'get_date', label:'获取日期', type:'date'},
      {key:'lead_source', label:'客资来源', type:'source'},
      {key:'customer_name', label:'客户姓名', type:'text'},
      {key:'contact_type', label:'联系方式', type:'contacttype'},
      {key:'customer_phone', label:'联系内容', type:'contactvalue'},
      {key:'visit_status', label:'进店情况', type:'select', options:VISIT_STATUS},
      {key:'intent_demand', label:'意向需求', type:'text'},
      {key:'community', label:'装修小区', type:'text'},
      {key:'consult_content', label:'咨询内容', type:'text'},
      {key:'assigned_to', label:'分配对象', type:'text'},
      {key:'creator_name', label:'录入人', type:'view'},
      {key:'follow_status', label:'跟进状态', type:'status'},
      {key:'follow_records', label:'历史跟进记录', type:'followtext'},
    ]
  }
};
// ============ 数据层：内存缓存 + 后端 API（多人协同）============
let token = localStorage.getItem('wb_token') || null;
let currentUser = JSON.parse(localStorage.getItem('wb_user') || 'null');
let cache = { wb_sv: [], wb_live: [], wb_leads: [], wb_staff: [] };
const DB = {
  get(k){ return cache[k] || []; },
  set(k, v){ cache[k] = v; }  // 仅写内存；落库由 saveRecord/delRecord 等显式调用 api
};
let editing = {module:null, id:null};
let detailId = null;

const API_BASE = '';  // 同域部署，相对路径即可
async function api(path, opts={}){
  const headers = { 'Content-Type': 'application/json' };
  if(token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, { ...opts, headers: { ...headers, ...(opts.headers||{}) } });
  if(res.status === 401){ doLogout(); throw new Error('登录已过期'); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}
function canEdit(){ return currentUser && ['admin','supervisor','operator'].includes(currentUser.role); }
function canEnterLeads(){ return currentUser && ['admin','supervisor','operator','salesman'].includes(currentUser.role); }
function canDelete(){ return currentUser && currentUser.role === 'admin'; }
function canAssign(){ return currentUser && ['admin','supervisor'].includes(currentUser.role); }
function canEditRecord(r){ if(!currentUser) return false; if(!canEdit()) return false; if(currentUser.role === 'operator') return r && r.created_by === currentUser.id; return true; }

// 加载所有数据到缓存
async function apiLoadAll(){
  const [sv, live, leads, staff] = await Promise.all([
    api('/api/short_video'), api('/api/live'), api('/api/leads'), api('/api/staff')
  ]);
  cache.wb_sv = sv.map(r => ({
    id: r.id, record_date: r.record_date ? (typeof r.record_date === 'string' ? r.record_date.slice(0,10) : r.record_date) : '',
    platforms: r.platforms || [], video_category: r.video_category || '',
    operator: r.operator || '', account: r.account || '',
    video_count: Number(r.video_count)||0, ad_spend: Number(r.ad_spend)||0,
    leads_count: Number(r.leads_count)||0, lead_form: r.lead_form || '',
    remark: r.remark || '', created_at: r.created_at, created_by: r.created_by
  }));
  cache.wb_live = live.map(r => {
    let ld = r.live_date;
    if(ld && typeof ld === 'string') ld = ld.replace(' ', 'T').slice(0, 16);
    return {
      id: r.id, live_date: ld, session_number: r.session_number || '',
      host: r.host || '', duration_minutes: Number(r.duration_hours)||0,
      sv_spend: Number(r.sv_spend)||0, live_spend: Number(r.live_spend)||0,
      omni_spend: Number(r.omni_spend)||0, mobile_live_spend: Number(r.mobile_live_spend)||0,
      omni_deal_amount: Number(r.omni_deal_amount)||0, omni_deal_count: Number(r.omni_deal_count)||0,
      live_leads: Number(r.live_leads)||0, sv_leads: Number(r.sv_leads)||0,
      remark: r.remark || '', created_at: r.created_at, created_by: r.created_by
    };

async function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  err.textContent='';
  if(!u || !p){ err.textContent='请填写账号和密码'; return; }
  try {
    const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username:u, password:p }) });
    const data = await r.json();
    if(!r.ok){ err.textContent = data.error || '登录失败'; return; }
    token = data.token;
    currentUser = data.user;
    localStorage.setItem('wb_token', token);
    localStorage.setItem('wb_user', JSON.stringify(currentUser));
    await apiLoadAll();
    showApp();
  } catch(e){ err.textContent = '网络错误：' + e.message; }
}
function doLogout(){
  token = null; currentUser = null;
  localStorage.removeItem('wb_token'); localStorage.removeItem('wb_user');
  cache = { wb_sv:[], wb_live:[], wb_leads:[], wb_staff:[] };
  document.getElementById('loginMask').style.display='flex';
  document.getElementById('appHeader').style.display='none';

/* ============ 工具函数 ============ */
function uid(){ return Date.now()+'-'+Math.random().toString(36).slice(2,7); }
function platformLabel(v){ if(!v) return '—'; if(Array.isArray(v)) return v.length? v.map(x=>(PLATFORMS.find(p=>p.v===x)||{}).l||x).join('、') : '—'; return (PLATFORMS.find(p=>p.v===v)||{}).l || v || '—'; }
function categoryLabel(v){ return (VIDEO_CATEGORIES.find(c=>c.v===v)||{}).l||v||'—'; }
function statusLabel(v){ return (STATUS.find(s=>s.v===v)||{}).l||v||'—'; }
function statusPill(v){ const l=statusLabel(v); return `<span class="pill" style="background:${STATUS_COLOR[v]||'#f2f3f5'}">${l}</span>`; }
function sum(arr,k){ return arr.reduce((s,r)=>s+(Number(r[k])||0),0); }
function filterByDate(arr,key,start,end){
  return arr.filter(r=>{
    const v=(r[key]||'').slice(0,10);
    const s=(start||'').slice(0,10);
    const e=(end||'').slice(0,10);
    if(s && v < s) return false;
    if(e && v > e) return false;
    return true;
  });
}
function colLetter(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26);} return s; }
function fmt(n){ return (Number(n)||0).toLocaleString('zh-CN',{minimumFractionDigits:0, maximumFractionDigits:2}); }
function today(){ return new Date().toISOString().slice(0,10); }
function getPeriodLabel(dateStr, period){
  if(!dateStr) return '未知';
  const d = new Date(dateStr);
  if(period==='week'){
    const y=d.getFullYear(), m=d.getMonth()+1;
    const startOfYear = new Date(y,0,1);
    const weekNum = Math.ceil(((d - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
    return `${y}年${String(m).padStart(2,'0')}月 第${weekNum}周`;
  }
  return `${d.getFullYear()}年${String(d.getMonth()+1).padStart(2,'0')}月`;
}
function groupByPeriod(arr, dateKey, period){
  const map={};
  arr.forEach(r=>{
    const label=getPeriodLabel(r[dateKey], period);
    if(!map[label]) map[label]=[];
    map[label].push(r);
  });
  return Object.entries(map).sort((a,b)=>b[0].localeCompare(a[0],'zh'));
}
function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderModule(moduleKey){
  const m = MODULES[moduleKey];
  const arr = DB.get(m.store);
  const addBtn = ((moduleKey === 'leads') ? canEnterLeads() : canEdit()) ? `<button class="btn" onclick="openForm('${moduleKey}')">+ 新增记录</button>` : '';
  let html = `<div class="card">
    <div class="toolbar">
      <h2 style="margin:0">${m.name}</h2>
      ${addBtn}
      <span style="flex:1"></span>
      <label>开始 <input type="date" id="f_start"></label>
      <label>结束 <input type="date" id="f_end"></label>
      <button class="btn ghost sm" onclick="applyFilter('${moduleKey}')">筛选</button>
      <button class="btn ghost sm" onclick="clearFilter('${moduleKey}')">清除</button>
    </div>
    <div id="modList"></div>
  </div>`;
  document.getElementById('main').innerHTML = html;
  renderModList(moduleKey, arr);
}
function renderModList(moduleKey, arr){
  const m = MODULES[moduleKey];
  const box = document.getElementById('modList');
  if(!arr.length){ box.innerHTML = `<div class="empty">暂无数据，点击「新增记录」开始录入</div>`; return; }
  let head = '<tr>'+m.fields.filter(f=>f.type!=='followtext').map(f=>`<th>${f.label}</th>`).join('')+'<th>操作</th></tr>';
  let rows = arr.slice().reverse().map(r=>{
    let cells = m.fields.filter(f=>f.type!=='followtext').map(f=>{
      let v = displayCell(r,f);
      return `<td>${v}</td>`;
    }).join('');
    let op = '<td>';
    if(moduleKey==='leads'){
      if(canAssign()) op += `<button class="btn ghost sm" onclick="openAssign('${r.id}')">分配</button> `;
      op += `<button class="btn ghost sm" onclick="openFollowUp('${r.id}')">跟进</button> `;
      if(canDelete()) op += `<button class="btn danger sm" onclick="delRecord('${moduleKey}','${r.id}')">删除</button>`;
    } else {
      const editable = canEditRecord(r);
      if(editable) op += `<button class="btn ghost sm" onclick="openForm('${moduleKey}','${r.id}')">编辑</button> `;
      if(canDelete()) op += `<button class="btn danger sm" onclick="delRecord('${moduleKey}','${r.id}')">删除</button>`;
      if(!editable && !canDelete()) op += '<span class="muted">只读</span>';
    }
    op += '</td>';
    return `<tr>${cells}${op}</tr>`;
  }).join('');
  box.innerHTML = `<table><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}
function displayCell(r,f){
  switch(f.type){
    case 'platforms': return platformLabel(r[f.key]);
    case 'category': return categoryLabel(r[f.key]);
    case 'leadform': return leadFormLabel(r[f.key]);
    case 'source': return LEAD_SOURCE_LABELS[r[f.key]] || r[f.key] || '—';
    case 'contacttype': return r[f.key]==='wechat'?'微信':(r[f.key]==='phone'?'电话号码':'—');
    case 'contactvalue': return contactDisplay(r);
    case 'select': { const o=(f.options||[]).find(x=>(typeof x==='string'?x:x.v)===r[f.key]); return o?(typeof o==='string'?o:o.l):(r[f.key]||'—'); }
    case 'status': return statusPill(r[f.key]);
    case 'followtext': return '';
    case 'view': return r[f.key]||'—';
    case 'computed':{ const v=f.compute(r); return v==null?'—':fmt(v); }
    case 'number': return r[f.key]===''||r[f.key]==null?'—':fmt(r[f.key]);
    default: return r[f.key]||'—';
  }
}
function applyFilter(moduleKey){
  const m=MODULES[moduleKey];
  const s=document.getElementById('f_start').value, e=document.getElementById('f_end').value;
  const arr = filterByDate(DB.get(m.store), m.dateKey, s, e);
  renderModList(moduleKey, arr);
}
function clearFilter(moduleKey){
  document.getElementById('f_start').value=''; document.getElementById('f_end').value='';
  renderModList(moduleKey, DB.get(MODULES[moduleKey].store));
}
function fieldInput(f, rec){
  const val = rec? rec[f.key]:'';
  const common = `data-key="${f.key}"`;
  switch(f.type){
    case 'date': return `<input type="date" ${common} value="${val||''}">`;
    case 'datetime-local': return `<input type="datetime-local" ${common} value="${val||''}">`;
    case 'select': return `<select ${common}><option value="">请选择</option>`+(f.options||[]).map(o=>{ const ov=typeof o==='string'?o:o.v; const ol=typeof o==='string'?o:(o.l||o.v); return `<option value="${ov}" ${val===ov?'selected':''}>${ol}</option>`; }).join('')+`</select>`;
    case 'number': return `<input type="number" step="0.01" ${common} value="${val!==''&&val!=null?val:''}">`;
    case 'text':
      if(f.key==='remark'||f.key==='intent_demand') return `<textarea ${common}>${val||''}</textarea>`;
      if(f.key==='assigned_to'){
        const staff=DB.get('wb_staff');
        return `<input type="text" list="staffList" ${common} value="${val||''}"><datalist id="staffList">${staff.map(s=>`<option value="${s}">`).join('')}</datalist>`;
      }
      if(f.key==='operator'||f.key==='host'){
        const staff=DB.get('wb_staff');
        return `<input type="text" list="opList" ${common} value="${val||''}" placeholder="输入或选择"><datalist id="opList">${staff.map(s=>`<option value="${s}">`).join('')}</datalist>`;
      }
      return `<input type="text" ${common} value="${val||''}">`;
    case 'platforms':
      return `<select ${common}><option value="">—请选择平台—</option>`+PLATFORMS.map(p=>`<option value="${p.v}" ${(rec&&rec[f.key]&&(rec[f.key]===p.v || (Array.isArray(rec[f.key])&&rec[f.key].includes(p.v))))?'selected':''}>${p.l}</option>`).join('')+`</select>`;
    case 'category':
      return `<select ${common}><option value="">—请选择—</option>`+VIDEO_CATEGORIES.map(c=>`<option value="${c.v}" ${val===c.v?'selected':''}>${c.l}</option>`).join('')+`</select>`;
    case 'leadform':
      return `<select ${common}><option value="">—请选择获资形式—</option>`+LEAD_FORMS.map(c=>`<option value="${c.v}" ${val===c.v?'selected':''}>${c.l}</option>`).join('')+`</select>`;
    case 'source':
      return `<select ${common}>`+['short_video','live_stream','offline','other'].map(o=>`<option value="${o}" ${val===o?'selected':''}>${LEAD_SOURCE_LABELS[o]}</option>`).join('')+`</select>`;
    case 'contacttype':
      return `<select ${common} onchange="onContactTypeChange()"><option value="">—请选择—</option><option value="phone" ${val==='phone'?'selected':''}>电话号码</option><option value="wechat" ${val==='wechat'?'selected':''}>微信</option></select>`;
    case 'contactvalue': {
      const ph = (rec && rec.contact_type==='phone') ? '请输入11位手机号' : (rec && rec.contact_type==='wechat' ? '请输入微信号（字母+数字）' : '请先选择联系方式');
      return `<input type="text" id="contactValueInput" ${common} value="${val||''}" placeholder="${ph}" ${rec && rec.contact_type==='phone'?'inputmode="numeric"':''}>`;
    }
    case 'status':
      return `<select ${common}>`+STATUS.map(s=>`<option value="${s.v}" ${val===s.v?'selected':''}>${s.l}</option>`).join('')+`</select>`;
    default: return `<input type="text" ${common} value="${val||''}">`;
  }
}
function openForm(moduleKey, id){
  const m = MODULES[moduleKey];
  let rec = id? DB.get(m.store).find(r=>r.id===id): null;
  // 新增记录时默认发布人/主播/分配对象为当前登录人（可改）
  if(!id){
    rec = {};
    if(moduleKey==='short_video') rec.operator = currentUser ? currentUser.display_name : '';
    if(moduleKey==='live') rec.host = currentUser ? currentUser.display_name : '';
    if(moduleKey==='leads' && currentUser && currentUser.role==='salesman') rec.assigned_to = currentUser.display_name;
  }
  editing = {module:moduleKey, id:id||null};
  const body = `<div class="form-grid">`+ m.fields.filter(f=>f.type!=='followtext' && f.type!=='computed' && f.type!=='view').map(f=>{
    const cls = '';
    return `<div class="${cls}"><label>${f.label}</label>${fieldInput(f, rec)}</div>`;
  }).join('')+`</div>`;
  document.getElementById('modalTitle').textContent = (id?'编辑':'新增')+m.name;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalFoot').innerHTML = `<button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="saveRecord('${moduleKey}')">保存</button>`;
  showModal();
}
function collectForm(moduleKey){
  const m=MODULES[moduleKey]; const rec={};
  m.fields.forEach(f=>{
    if(f.type==='computed'||f.type==='view') return;
    if(f.type==='platforms'){
      const sel=document.querySelector('#modalBody [data-key="platforms"]');
      rec.platforms = sel ? sel.value : '';
    } else if(f.type==='source'){
      const s=document.querySelector('#modalBody [data-key="lead_source"]'); rec.lead_source=s?s.value:'short_video';
    } else {
      const el=document.querySelector(`#modalBody [data-key="${f.key}"]`);
      let v=el?el.value:'';
      if(f.type==='number') v = v===''?'':Number(v);
      rec[f.key]=v;
    }
  });
  return rec;
}
function onContactTypeChange(){
  const sel = document.querySelector('#modalBody [data-key="contact_type"]') || document.getElementById('d_contact_type');
  const inp = document.getElementById('contactValueInput') || document.getElementById('d_phone');
  if(!sel || !inp) return;
  const t = sel.value;
  inp.placeholder = t==='phone' ? '请输入11位手机号' : t==='wechat' ? '请输入微信号（字母+数字）' : '请先选择联系方式';
  if(t==='phone'){ inp.setAttribute('inputmode','numeric'); } else { inp.removeAttribute('inputmode'); }
}
async function saveRecord(moduleKey){
  const rec=collectForm(moduleKey);
  if(moduleKey==='short_video' && !rec.record_date){ alert('请填写日期'); return; }
  if(moduleKey==='live' && !rec.live_date){ alert('请填写直播日期'); return; }
  if(moduleKey==='leads'){
    if(!rec.get_date){ alert('请填写获取日期'); return; }
    if(!rec.customer_name){ alert('请填写客户姓名'); return; }
    const cv = (rec.customer_phone||'').trim();
    if(rec.contact_type==='phone' && !/^1\d{10}$/.test(cv)){ alert('电话号码需为11位手机号'); return; }
    if(rec.contact_type==='wechat' && !/^[A-Za-z0-9]+$/.test(cv)){ alert('微信号只能包含字母和数字'); return; }
  }
  // 转换为后端期望的字段名（live：duration_minutes → duration_hours）
  const body = JSON.parse(JSON.stringify(rec));
  if(moduleKey === 'live'){
    body.duration_hours = Number(body.duration_minutes)||0;
    delete body.duration_minutes;
  }
  const apiPath = '/api/' + (moduleKey === 'short_video' ? 'short_video' : moduleKey);
  try {
    if(editing.id){
      await api(apiPath + '/' + editing.id, { method:'PUT', body: JSON.stringify(body) });
    } else {
      await api(apiPath, { method:'POST', body: JSON.stringify(body) });
    }
    await apiLoadAll();
    closeModal();
    if(moduleKey === 'leads' && currentUser && currentUser.role === 'salesman') renderMyLeads();
    else renderModule(moduleKey);
  } catch(e){ alert('保存失败：' + e.message); }
}
async function delRecord(moduleKey,id){
  if(!confirm('确定删除该记录？')) return;
  const apiPath = '/api/' + (moduleKey === 'short_video' ? 'short_video' : moduleKey);
  try {
    await api(apiPath + '/' + id, { method:'DELETE' });
    await apiLoadAll();
    renderModule(moduleKey);
  } catch(e){ alert('删除失败：' + e.message); }
}

async function saveLeadDetail(){
  const body = {
    get_date: document.getElementById('d_date').value,
    customer_name: document.getElementById('d_name').value,
    contact_type: document.getElementById('d_contact_type').value,
    customer_phone: document.getElementById('d_phone').value,
    visit_status: document.getElementById('d_visit').value,
    intent_demand: document.getElementById('d_intent').value,
    follow_status: document.getElementById('d_status').value,
  };
  // 只有有分配权限的用户才能修改分配对象

/* ============ 周期汇总 ============ */
let periodicPeriod = 'month';
function renderPeriodic(){
  const html=`<div class="card">
    <div class="toolbar">
      <h2 style="margin:0">周期滚动汇总</h2>
      <span style="flex:1"></span>
      <label>开始 <input type="date" id="p_start"></label>
      <label>结束 <input type="date" id="p_end"></label>
      <button class="btn" onclick="drawPeriodic()">统计</button>
    </div>
    <div class="period-tabs">
      <button class="${periodicPeriod==='week'?'active':''}" onclick="setPeriod('week')">按周汇总</button>
      <button class="${periodicPeriod==='month'?'active':''}" onclick="setPeriod('month')">按月汇总</button>
    </div>
    <div id="periodicBody"></div>
  </div>`;
  document.getElementById('main').innerHTML=html;
  drawPeriodic();
}
function setPeriod(p){ periodicPeriod=p; drawPeriodic(); }
function drawPeriodic(){
  const s=document.getElementById('p_start').value, e=document.getElementById('p_end').value;
  const sv=filterByDate(DB.get('wb_sv'),'record_date',s,e);
  const live=filterByDate(DB.get('wb_live'),'live_date',s,e);
  const ad=filterByDate(DB.get('wb_live'),'live_date',s,e);
  const leads=filterByDate(DB.get('wb_leads'),'get_date',s,e);

  const svGroups=groupByPeriod(sv,'record_date',periodicPeriod);
  const catMap={};
  VIDEO_CATEGORIES.forEach(c=>{ catMap[c.v]={name:c.l, videos:0, spend:0, leads:0}; });
  sv.forEach(r=>{
    const cat=r.video_category||'other';
    if(!catMap[cat]) catMap[cat]={name:categoryLabel(cat), videos:0, spend:0, leads:0};
    catMap[cat].videos+=(Number(r.video_count)||0);
    catMap[cat].spend+=(Number(r.ad_spend)||0);
    catMap[cat].leads+=(Number(r.leads_count)||0);
  });

  const liveGroups=groupByPeriod(live,'live_date',periodicPeriod);
  const adGroups=groupByPeriod(ad,'live_date',periodicPeriod);
  const leadGroups=groupByPeriod(leads,'get_date',periodicPeriod);
  const periodLabel=periodicPeriod==='week'?'周':'月';

  let html='';

  html+=`<div class="section-title">短视频发布（按${periodLabel}）</div>`;
  html+=`<div style="overflow-x:auto"><table><thead><tr><th>${periodicPeriod==='week'?'周期':'月份'}</th><th>发布视频数</th><th>投流消耗(元)</th><th>客资线索数</th><th>获资成本(元/客资)</th></tr></thead><tbody>`;
  if(svGroups.length){
    svGroups.forEach(([label,rows])=>{
      const vids=sum(rows,'video_count'), sp=sum(rows,'ad_spend'), lds=sum(rows,'leads_count');
      html+=`<tr><td>${label}</td><td>${vids}</td><td>${fmt(sp)}</td><td>${lds}</td><td>${lds?fmt(sp/lds):'—'}</td></tr>`;
    });
    html+=`<tr style="background:#eef3ff;font-weight:bold"><td>合计</td><td>${sum(sv,'video_count')}</td><td>${fmt(sum(sv,'ad_spend'))}</td><td>${sum(sv,'leads_count')}</td><td>${sum(sv,'leads_count')?fmt(sum(sv,'ad_spend')/sum(sv,'leads_count')):'—'}</td></tr>`;
  } else { html+=`<tr><td colspan="5" class="empty">暂无数据</td></tr>`; }
  html+=`</tbody></table></div>`;

  html+=`<div class="section-title">短视频种类分布</div>`;
  html+=`<div style="overflow-x:auto"><table><thead><tr><th>种类</th><th>发布视频数</th><th>投流消耗(元)</th><th>客资线索数</th><th>获资成本(元/客资)</th></tr></thead><tbody>`;
  const catEntries=Object.entries(catMap).filter(([k,v])=>v.videos>0||v.spend>0||v.leads>0);
  if(catEntries.length){
    catEntries.forEach(([k,v])=>{
      html+=`<tr><td><span class="cat-tag">${v.name}</span></td><td>${v.videos}</td><td>${fmt(v.spend)}</td><td>${v.leads}</td><td>${v.leads?fmt(v.spend/v.leads):'—'}</td></tr>`;
    });
  } else { html+=`<tr><td colspan="5" class="empty">暂无数据</td></tr>`; }
  html+=`</tbody></table></div>`;

  // 按发布人统计
  const opMap={};
  sv.forEach(r=>{ const op=r.operator||'未填'; if(!opMap[op]) opMap[op]={videos:0,spend:0,leads:0}; opMap[op].videos+=Number(r.video_count)||0; opMap[op].spend+=Number(r.ad_spend)||0; opMap[op].leads+=Number(r.leads_count)||0; });
  const opEntries=Object.entries(opMap).filter(([,v])=>v.videos>0||v.spend>0);
  if(opEntries.length){
    html+=`<div class="section-title">短视频按发布人统计</div>`;
    html+=`<div style="overflow-x:auto"><table><thead><tr><th>发布人</th><th>发布视频数</th><th>投流消耗(元)</th><th>客资线索数</th><th>均条成本(元)</th></tr></thead><tbody>`;
    opEntries.forEach(([op,v])=>{ html+=`<tr><td>${escapeHtml(op)}</td><td>${v.videos}</td><td>${fmt(v.spend)}</td><td>${v.leads}</td><td>${v.videos?fmt(v.spend/v.videos):'—'}</td></tr>`; });
    html+=`</tbody></table></div>`;
  }

  // 按主播统计
  const hostMap={};
  live.forEach(r=>{ const h=r.host||'未填'; if(!hostMap[h]) hostMap[h]={sessions:0,spend:0,leads:0}; hostMap[h].sessions++; hostMap[h].spend+=liveTotalSpend(r); hostMap[h].leads+=liveTotalLeads(r); });
  const hostEntries=Object.entries(hostMap).filter(([,v])=>v.sessions>0);
  if(hostEntries.length){
    html+=`<div class="section-title">直播按主播统计</div>`;
    html+=`<div style="overflow-x:auto"><table><thead><tr><th>主播</th><th>直播场次</th><th>投流消耗(元)</th><th>客资线索数</th><th>获资成本(元/客资)</th></tr></thead><tbody>`;
    hostEntries.forEach(([h,v])=>{ html+=`<tr><td>${escapeHtml(h)}</td><td>${v.sessions}</td><td>${fmt(v.spend)}</td><td>${v.leads}</td><td>${v.leads?fmt(v.spend/v.leads):'—'}</td></tr>`; });
    html+=`</tbody></table></div>`;
  }

  html+=`<div class="section-title">直播间直播（按${periodLabel}）</div>`;
  html+=`<div class="overflow-x:auto"><table><thead><tr><th>${periodicPeriod==='week'?'周期':'月份'}</th><th>直播场次</th><th>投流消耗(元)</th><th>本场客资数</th><th>获资成本(元/客资)</th></tr></thead><tbody>`;
  if(liveGroups.length){
    liveGroups.forEach(([label,rows])=>{
      const sp=rows.reduce((s,r)=>s+liveTotalSpend(r),0), lds=rows.reduce((s,r)=>s+liveTotalLeads(r),0);
      html+=`<tr><td>${label}</td><td>${rows.length}</td><td>${fmt(sp)}</td><td>${lds}</td><td>${lds?fmt(sp/lds):'—'}</td></tr>`;
    });
    html+=`<tr style="background:#eef3ff;font-weight:bold"><td>合计</td><td>${live.length}</td><td>${fmt(live.reduce((s,r)=>s+liveTotalSpend(r),0))}</td><td>${live.reduce((s,r)=>s+liveTotalLeads(r),0)}</td><td>${live.reduce((s,r)=>s+liveTotalLeads(r),0)?fmt(live.reduce((s,r)=>s+liveTotalSpend(r),0)/live.reduce((s,r)=>s+liveTotalLeads(r),0)):'—'}</td></tr>`;
  } else { html+=`<tr><td colspan="5" class="empty">暂无数据</td></tr>`; }
  html+=`</tbody></table></div>`;

  html+=`<div class="section-title">每日投流消耗（按${periodLabel}）</div>`;
  html+=`<div style="overflow-x:auto"><table><thead><tr><th>${periodicPeriod==='week'?'周期':'月份'}</th><th>短视频消耗</th><th>直播消耗</th><th>全域投放</th><th>手机端直播</th><th>总消耗</th><th>全域成交金额</th><th>全域成交数</th><th>直播获资</th><th>短视频获资</th><th>直播获资成本</th><th>视频获资成本</th></tr></thead><tbody>`;
  if(adGroups.length){
    adGroups.forEach(([label,rows])=>{
      const svs=sum(rows,'sv_spend'), lvs=sum(rows,'live_spend'), oms=sum(rows,'omni_spend'), mbs=sum(rows,'mobile_live_spend');
      const tot=svs+lvs+oms+mbs;
      const lvl=sum(rows,'live_leads'), svl=sum(rows,'sv_leads');
      html+=`<tr><td>${label}</td><td>${fmt(svs)}</td><td>${fmt(lvs)}</td><td>${fmt(oms)}</td><td>${fmt(mbs)}</td><td style="background:#fff8d9;font-weight:600">${fmt(tot)}</td><td>${fmt(sum(rows,'omni_deal_amount'))}</td><td>${sum(rows,'omni_deal_count')}</td><td>${lvl}</td><td>${svl}</td><td style="background:#fff8d9">${lvl?fmt(lvs/lvl):'—'}</td><td style="background:#fff8d9">${svl?fmt(svs/svl):'—'}</td></tr>`;
    });
    const svs=sum(ad,'sv_spend'), lvs=sum(ad,'live_spend'), oms=sum(ad,'omni_spend'), mbs=sum(ad,'mobile_live_spend');
    const tot=svs+lvs+oms+mbs, lvl=sum(ad,'live_leads'), svl=sum(ad,'sv_leads');
    html+=`<tr style="background:#eef3ff;font-weight:bold"><td>合计</td><td>${fmt(svs)}</td><td>${fmt(lvs)}</td><td>${fmt(oms)}</td><td>${fmt(mbs)}</td><td style="background:#fff8d9">${fmt(tot)}</td><td>${fmt(sum(ad,'omni_deal_amount'))}</td><td>${sum(ad,'omni_deal_count')}</td><td>${lvl}</td><td>${svl}</td><td style="background:#fff8d9">${lvl?fmt(lvs/lvl):'—'}</td><td style="background:#fff8d9">${svl?fmt(svs/svl):'—'}</td></tr>`;
  } else { html+=`<tr><td colspan="12" class="empty">暂无数据</td></tr>`; }
  html+=`</tbody></table></div>`;

  html+=`<div class="section-title">客资线索（按${periodLabel}）</div>`;
  html+=`<div style="overflow-x:auto"><table><thead><tr><th>${periodicPeriod==='week'?'周期':'月份'}</th><th>短视频来源</th><th>直播间来源</th><th>合计</th></tr></thead><tbody>`;
  if(leadGroups.length){
    leadGroups.forEach(([label,rows])=>{
      const svL=rows.filter(r=>r.lead_source==='short_video').length;
      const lvL=rows.filter(r=>r.lead_source==='live_stream').length;
      html+=`<tr><td>${label}</td><td>${svL}</td><td>${lvL}</td><td>${rows.length}</td></tr>`;
    });
    const svL=leads.filter(r=>r.lead_source==='short_video').length;
    const lvL=leads.filter(r=>r.lead_source==='live_stream').length;
    html+=`<tr style="background:#eef3ff;font-weight:bold"><td>合计</td><td>${svL}</td><td>${lvL}</td><td>${leads.length}</td></tr>`;
  } else { html+=`<tr><td colspan="4" class="empty">暂无数据</td></tr>`; }
  html+=`</tbody></table></div>`;

  document.getElementById('periodicBody').innerHTML=html;
}

/* ============ 数据看板 ============ */
function renderDash(){
  const html=`<div class="card">
    <div class="toolbar">
      <h2 style="margin:0">汇总统计看板</h2>
      <span style="flex:1"></span>
      <label>开始 <input type="date" id="d_start"></label>
      <label>结束 <input type="date" id="d_end"></label>
      <button class="btn" onclick="drawDash()">统计</button>
      <button class="btn ghost sm" onclick="loadDemo()">载入示例数据</button>
    </div>
    <div id="dashBody"></div>
  </div>`;
  document.getElementById('main').innerHTML=html;
  drawDash();
}
function drawDash(){
  const s=document.getElementById('d_start').value, e=document.getElementById('d_end').value;
  const sv=filterByDate(DB.get('wb_sv'),'record_date',s,e);
  const live=filterByDate(DB.get('wb_live'),'live_date',s,e);
  const leads=filterByDate(DB.get('wb_leads'),'get_date',s,e);
  const svVideos=sum(sv,'video_count'), svSpend=sum(sv,'ad_spend');
  const liveSessions=live.length, liveSpend=live.reduce((s,r)=>s+liveTotalSpend(r),0);
  const svLeads=leads.filter(l=>l.lead_source==='short_video').length;
  const liveLeads=leads.filter(l=>l.lead_source==='live_stream').length;
  const totalLeads=leads.length;
  const svReported=sum(sv,'leads_count'), liveReported=live.reduce((s,r)=>s+liveTotalLeads(r),0);
  const staff=DB.get('wb_staff');
  const ranking = staff.map(name=>{
    const mine=leads.filter(l=>l.assigned_to===name);
    const by=k=>mine.filter(l=>l.follow_status===k).length;
    return {name, total:mine.length, deal:by('deal_closed'), comm:by('in_communication'), pending:by('pending_contact'), churn:by('churned')};
  }).sort((a,b)=>b.total-a.total);

  let cards=`<div class="stats-grid">
    <div class="stat"><div class="n">${fmt(svVideos)}</div><div class="l">短视频总发布数</div></div>
    <div class="stat"><div class="n">¥${fmt(svSpend)}</div><div class="l">短视频总投流花费</div></div>
    <div class="stat"><div class="n">${liveSessions}</div><div class="l">直播总场次</div></div>
    <div class="stat"><div class="n">¥${fmt(liveSpend)}</div><div class="l">直播间总投流花费</div></div>
    <div class="stat"><div class="n">${svLeads}</div><div class="l">短视频来源客资</div></div>
    <div class="stat"><div class="n">${liveLeads}</div><div class="l">直播间来源客资</div></div>
    <div class="stat"><div class="n">${totalLeads}</div><div class="l">全部客资汇总</div></div>
  </div>`;

  let recon=`<h2 style="margin-top:20px">留资对账（方案Y）</h2><div class="recon">
    <div class="row"><span>短视频：填报留资 ${svReported}  vs  建档客资 ${svLeads}</span><span class="${svReported===svLeads?'ok':'bad'}">${svReported===svLeads?'一致':'不一致'}</span></div>
    <div class="row"><span>直播间：填报留资 ${liveReported}  vs  建档客资 ${liveLeads}</span><span class="${liveReported===liveLeads?'ok':'bad'}">${liveReported===liveLeads?'一致':'不一致'}</span></div>
  </div>`;

  let rankTable=`<h2 style="margin-top:20px">按销售人员统计</h2><table><thead><tr><th>销售</th><th>分配客资</th><th>已成交</th><th>沟通中</th><th>待联系</th><th>流失</th><th>成交率</th></tr></thead><tbody>`+
    (ranking.length?ranking.map(r=>`<tr><td>${r.name}</td><td>${r.total}</td><td>${r.deal}</td><td>${r.comm}</td><td>${r.pending}</td><td>${r.churn}</td><td>${r.total?((r.deal/r.total)*100).toFixed(1)+'%':'—'}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">暂无可统计销售</td></tr>')+
    `</tbody></table>`;

  const ad=filterByDate(DB.get('wb_live'),'live_date',s,e);
  const adSvS=sum(ad,'sv_spend'), adLvS=sum(ad,'live_spend'), adOmS=sum(ad,'omni_spend'), adMbS=sum(ad,'mobile_live_spend');
  const adTotS=adSvS+adLvS+adOmS+adMbS;
  const adLvL=sum(ad,'live_leads'), adSvL=sum(ad,'sv_leads');
  const adOmA=sum(ad,'omni_deal_amount'), adOmC=sum(ad,'omni_deal_count');
  const adLvCpl=adLvL?adLvS/adLvL:null, adSvCpl=adSvL?adSvS/adSvL:null;
  const adH=['直播日期','短视频消耗','直播消耗','全域投放','手机端直播','全域成交金额','全域成交数','总消耗','直播获资','短视频获资','直播获资成本','视频获资成本'];
  const adBody= ad.length? ad.slice().reverse().map(r=>{ const t=Number(r.sv_spend||0)+Number(r.live_spend||0)+Number(r.omni_spend||0)+Number(r.mobile_live_spend||0); const lc=r.live_leads>0?r.live_spend/r.live_leads:null; const sc=r.sv_leads>0?r.sv_spend/r.sv_leads:null; return `<tr><td>${r.live_date||''}</td><td>${fmt(r.sv_spend)}</td><td>${fmt(r.live_spend)}</td><td>${fmt(r.omni_spend)}</td><td>${fmt(r.mobile_live_spend)}</td><td>${fmt(r.omni_deal_amount)}</td><td>${fmt(r.omni_deal_count)}</td><td style="background:#fff8d9">${fmt(t)}</td><td>${fmt(r.live_leads)}</td><td>${fmt(r.sv_leads)}</td><td style="background:#fff8d9">${lc?fmt(lc):'—'}</td><td style="background:#fff8d9">${sc?fmt(sc):'—'}</td></tr>`; }).join('')+`<tr style="background:#eef3ff;font-weight:bold"><td>合计</td><td>${fmt(adSvS)}</td><td>${fmt(adLvS)}</td><td>${fmt(adOmS)}</td><td>${fmt(adMbS)}</td><td>${fmt(adOmA)}</td><td>${fmt(adOmC)}</td><td style="background:#fff8d9">${fmt(adTotS)}</td><td>${fmt(adLvL)}</td><td>${fmt(adSvL)}</td><td style="background:#fff8d9">${adLvCpl?fmt(adLvCpl):'—'}</td><td style="background:#fff8d9">${adSvCpl?fmt(adSvCpl):'—'}</td></tr>` : '<tr><td colspan="12" class="empty">暂无投流消耗数据</td></tr>';
  const adSection=`<h2 style="margin-top:20px">每日投流消耗</h2><div style="overflow-x:auto"><table><thead><tr>${adH.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${adBody}</tbody></table></div>`;
  document.getElementById('dashBody').innerHTML = cards+recon+rankTable+adSection;
}

function setAllFields(v){ document.querySelectorAll('.expf').forEach(c=>c.checked=v); }
function exportValue(rec,f){
  switch(f.type){
    case 'platforms': return platformLabel(rec[f.key]);
    case 'category': return categoryLabel(rec[f.key]);
    case 'leadform': return leadFormLabel(rec[f.key]);
    case 'source': return LEAD_SOURCE_LABELS[rec[f.key]] || rec[f.key] || '';
    case 'contactvalue': return contactDisplay(rec);
    case 'select': { const o=(f.options||[]).find(x=>(typeof x==='string'?x:x.v)===rec[f.key]); return o?(typeof o==='string'?o:o.l):(rec[f.key]||''); }
    case 'status': return statusLabel(rec[f.key]);
    case 'followtext':
      const rs=rec.follow_records||[];
      return rs.map(r=>`[${r.date||''}] ${r.content||''}${r.next?(' → 计划:'+r.next):''}`).join('\n');
    case 'number': return Number(rec[f.key]||0);
    default: return rec[f.key]||'';
  }
}
function buildSheetData(fields, data, isFullExport){
  const colMap={};
  fields.forEach((f,i)=>{ colMap[f.key]=colLetter(i+1); });
  const lastDataRow = data.length+1;
  const totalRow = lastDataRow+1;
  const totSv=sum(data,'sv_spend'), totLv=sum(data,'live_spend'), totOm=sum(data,'omni_spend'), totMb=sum(data,'mobile_live_spend');
  const totLvL=sum(data,'live_leads'), totSvL=sum(data,'sv_leads'), totOmC=sum(data,'omni_deal_count');
  const aoa=[];
  aoa.push(fields.map(f=>f.label));
  data.forEach((rec,ri)=>{
    const r = ri+2;
    aoa.push(fields.map(f=>{
      if(f.type==='computed'){
        const need = f.refKeys||[];
        if(!need.every(k=>k in colMap)) return {t:'n', v:0};
        const v = f.compute(rec);
        let fStr='';
        if(f.key==='total_spend') fStr = `SUM(${need.map(k=>colMap[k]+r).join(',')})`;
        else if(f.key==='live_cpl') fStr = `IF(${colMap.live_leads}${r}>0,${colMap.live_spend}${r}/${colMap.live_leads}${r},"")`;
        else if(f.key==='sv_cpl') fStr = `IF(${colMap.sv_leads}${r}>0,${colMap.sv_spend}${r}/${colMap.sv_leads}${r},"")`;
        else if(f.key==='lead_cost') fStr = `IF(${colMap.leads_count}${r}>0,${colMap.ad_spend}${r}/${colMap.leads_count}${r},"")`;
        else if(f.key==='conversion_rate') fStr = `IF((${colMap.live_leads}${r}+${colMap.sv_leads}${r})>0,${colMap.omni_deal_count}${r}/(${colMap.live_leads}${r}+${colMap.sv_leads}${r}),"")`;
        return {t:'n', f:fStr, v: v==null?0:v };
      }
      return exportValue(rec,f);
    }));
  });
  const total = fields.map((f,i)=>{
    if(f.type==='computed'){
      const need = f.refKeys||[];
      if(!need.every(k=>k in colMap)) return {t:'n', v:0};
      let v=0, fStr='';
      if(f.key==='total_spend'){ v=totSv+totLv+totOm+totMb; fStr=`SUM(${colMap.total_spend}2:${colMap.total_spend}${lastDataRow})`; }
      else if(f.key==='live_cpl'){ v=totLvL>0?totLv/totLvL:0; fStr=`IF(${colMap.live_leads}${totalRow}>0,${colMap.live_spend}${totalRow}/${colMap.live_leads}${totalRow},"")`; }
      else if(f.key==='sv_cpl'){ v=totSvL>0?totSv/totSvL:0; fStr=`IF(${colMap.sv_leads}${totalRow}>0,${colMap.sv_spend}${totalRow}/${colMap.sv_leads}${totalRow},"")`; }
      else if(f.key==='lead_cost'){ v=sum(data,'leads_count')>0?sum(data,'ad_spend')/sum(data,'leads_count'):0; fStr=`IF(${colMap.leads_count}${totalRow}>0,${colMap.ad_spend}${totalRow}/${colMap.leads_count}${totalRow},"")`; }
      else if(f.key==='conversion_rate'){ v=(totLvL+totSvL)>0?totOmC/(totLvL+totSvL):0; fStr=`IF((${colMap.live_leads}${totalRow}+${colMap.sv_leads}${totalRow})>0,${colMap.omni_deal_count}${totalRow}/(${colMap.live_leads}${totalRow}+${colMap.sv_leads}${totalRow}),"")`; }
      return {t:'n', f:fStr, v};
    }
    if(f.type==='number'){
      const L=colMap[f.key];
      const s2=sum(data,f.key);
      return {t:'n', f:`SUM(${L}2:${L}${lastDataRow})`, v:s2};
    }
    if(i===0) return '合计';
    return '';
  });
  aoa.push(total);
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const range=XLSX.utils.decode_range(ws['!ref']);
  for(let c=range.s.c;c<=range.e.c;c++){
    const addr=XLSX.utils.encode_cell({r:0,c}); if(!ws[addr]) ws[addr]={};
    ws[addr].s={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'4472C4'}},alignment:{horizontal:'center',vertical:'center'}};
  }
  const tr=range.e.r;
  for(let c=range.s.c;c<=range.e.c;c++){
    const addr=XLSX.utils.encode_cell({r:tr,c}); if(!ws[addr]) ws[addr]={};
    ws[addr].s={font:{bold:true},fill:{fgColor:{rgb:'D9E1F2'}}};
  }
  fields.forEach((f,i)=>{
    if(f.type!=='computed') return;
    for(let r=1; r<range.e.r; r++){
      const addr=XLSX.utils.encode_cell({r,c:i}); if(!ws[addr]) ws[addr]={};
      ws[addr].s=Object.assign({},ws[addr].s||{},{fill:{fgColor:{rgb:'FFF2CC'}}});
    }
  });
  // 备注红字（boss 要求：备注列文字标红）
  const remarkIdx=fields.findIndex(f=>f.key==='remark');
  if(remarkIdx>=0){
    for(let r=1; r<range.e.r; r++){
      const addr=XLSX.utils.encode_cell({r,c:remarkIdx}); if(!ws[addr]) continue;
      ws[addr].s=Object.assign({},ws[addr].s||{},{font:{color:{rgb:'FF0000'}}});
    }
  }
  ws['!cols']=fields.map(f=>({wch:Math.max(12,f.label.length*2+2)}));
  return ws;
}
function doExport(){
  const mk=document.getElementById('exp_module').value;
  const m=MODULES[mk];
  const s=document.getElementById('exp_start2').value, e=document.getElementById('exp_end2').value;
  const fname=document.getElementById('exp_filename2').value||'导出数据';
  const keys=[...document.querySelectorAll('.expf:checked')].map(c=>c.value);
  if(!keys.length){ alert('请至少选择一列'); return; }
  const fields=m.fields.filter(f=>keys.includes(f.key));
  const data=filterByDate(DB.get(m.store), m.dateKey, s, e);
  const ws=buildSheetData(fields, data, false);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, m.name.slice(0,31));
  wb.Workbook={FullCalcOnLoad:true};
  XLSX.writeFile(wb, fname.endsWith('.xlsx')?fname:(fname+'.xlsx'));
  api('/api/logs', { method:'POST', body: JSON.stringify({ action:'export', target:'xlsx', detail:'导出'+m.name+'数据表' }) }).catch(()=>{});
}

// 检测Excel某列头最可能对应哪个字段key
function detectField(colName){
  if(!colName) return null;
  const norm = String(colName).trim().toLowerCase();
  for(const [key, kwList] of Object.entries(COLUMN_MAP)){
    for(const kw of kwList[0]){
      if(norm.includes(kw.toLowerCase()) || kw.includes(colName.trim())){
        return key;
      }
    }
  }
  return null;
}

// 检测Excel数据对应哪个模块
function detectModule(headers){
  const scores = { short_video:0, live:0, leads:0 };
  headers.forEach(h=>{
    const key = detectField(h);
    if(!key) return;
    if(['record_date','platforms','video_category','operator','account','video_count','lead_form','leads_count'].includes(key)) scores.short_video+=2;
    if(['live_date','session_number','host','duration_minutes','sv_spend','live_spend','omni_spend','mobile_live_spend','omni_deal_amount','omni_deal_count','total_spend','live_leads','sv_leads','leads_count','ad_spend'].includes(key)) scores.live+=2;
    if(['get_date','lead_source','customer_name','customer_phone','intent_demand','assigned_to','follow_status','community','consult_content'].includes(key)) scores.leads+=3;
  });
  // 特殊字段唯一性加权
  if(headers.some(h=>/主播|host/i.test(h))) scores.live+=5;
  if(headers.some(h=>/发布人|账号运营|账号$/i.test(h))) scores.short_video+=5;
  if(headers.some(h=>/短视频消耗|直播消耗|全域投放|投流/i.test(h))) scores.live+=5;
  if(headers.some(h=>/客户姓名|客户名称|意向需求/i.test(h))) scores.leads+=5;
  const best=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
  return { module: best[0], score: best[1] };
}

// 将Excel行映射为record
function mapRowToRecord(row, colMap, moduleKey){
  const rec={};
  colMap.forEach((fieldKey, colIdx)=>{
    let v = row[colIdx];
    if(v===undefined||v===null||v==='') return;
    // 日期处理：转为 YYYY-MM-DD
    if(fieldKey.includes('date') && v){
      if(typeof v==='number' && v>25569 && v<50000){
        const d=new Date((v-25569)*86400000);
        v=d.toISOString().slice(0,10);
      } else if(typeof v==='string'){
        const m=v.match(/(\d{4})[年/-](\d{1,2})[月/-](\d{1,2})/);
        if(m) v=`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
        else v=v.slice(0,10);
      }
    }
    // 平台多选：逗号/顿号分隔的字符串转数组
    if(fieldKey==='platforms' && typeof v==='string'){
      const str=v.toLowerCase();
      let plat='';
      if(/抖音|douyin/i.test(str)) plat='douyin';
      else if(/视频号|weixinv|微信视频/i.test(str)) plat='weixinv';
      else if(/快手|kuaishou/i.test(str)) plat='kuaishou';
      else if(/小红书|xhs|redbook/i.test(str)) plat='xiaohongshu';
      else if(/b站|bili|bilibili/i.test(str)) plat='bilibili';
      if(plat) v=plat; else return;
    }
    // 数值
    if(['video_count','ad_spend','leads_count','session_number','duration_minutes','sv_spend','live_spend','omni_spend','mobile_live_spend','omni_deal_amount','omni_deal_count','live_leads','sv_leads'].includes(fieldKey)){
      const n=parseFloat(String(v).replace(/[^\d.]/g,''));
      if(!isNaN(n)) v=n; else return;
    }
    // 来源
    if(fieldKey==='lead_source'){
      if(/直播|live|直播间/i.test(String(v))) v='live_stream'; else v='short_video';
    }
    // 状态
    if(fieldKey==='follow_status'){
      const map2={待联系:'pending_contact',已联系:'contacted',沟通中:'in_communication',上门量房:'house_measuring',方案对接:'plan_discussion',已成交:'deal_closed',流失:'churned'};
      v=map2[v]||v;
    }
    rec[fieldKey]=v;
  });
  if(rec.ad_spend!==undefined){ if(rec.live_spend===undefined||rec.live_spend==='') rec.live_spend=rec.ad_spend; delete rec.ad_spend; }
  return rec;
}

let pendingImportData = null;

function handleImportFile(input){
  const file = input.files && input.files[0];
  if(!file){ const dt=input.files2; if(dt&&dt.files[0]) return handleImportFile2(dt.files[0]); return; }

  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      if(!wb.SheetNames.length){ alert('未找到工作表'); return; }
      const sheetName=wb.SheetNames[0];
      const ws=wb.Sheets[sheetName];
      const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(data.length<2){ alert('数据行不足，请确保有表头和数据行'); return; }
      const headers=data[0].map(h=>String(h).trim());
      const rows=data.slice(1).filter(r=>r.some(c=>c!==''));

      const {module,score}=detectModule(headers);
      if(score===0){ alert('无法识别该表格的模块类型，请确保表头包含「日期」「投流」「客资」等关键词'); return; }

      // 建立列索引→字段key 映射
      const colMap=new Map(); // colIdx → fieldKey
      headers.forEach((h,i)=>{
        const k=detectField(h);
        if(k) colMap.set(i,k);
      });

      // 取模块的必填日期字段
      const dateKey=MODULES[module]?.dateKey||'date';
      const hasDate=[...colMap.values()].includes(dateKey);

      // 取前3行预览
      const previewRows=rows.slice(0,3).map(r=>{
        const cells=[...colMap.entries()].map(([ci,key])=>{
          let v=r[ci];
          if(v instanceof Date) v=v.toISOString().slice(0,10);
          if(typeof v==='number' && v>25569 && v<50000){
            const d=new Date((v-25569)*86400000);
            v=d.toISOString().slice(0,10);
          }
          return escapeHtml(String(v===undefined||v===null?'':v));
        });
        return `<tr>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`;
      }).join('');

      const hasDateCol=headers.filter(h=>detectField(h)==='date'||detectField(h)===dateKey).join('、')||'未识别';
      const previewHtml=`
        <div class="import-preview">
          <div style="padding:12px;background:#f7f9ff;border-bottom:1px solid #e5e8ef">
            <span class="import-badge import-ok">✓ 识别为：${MODULES[module]?.name||module}</span>
            <span style="margin-left:12px;color:#86909c;font-size:12px">匹配度：${score}分，共 ${rows.length} 行数据</span>
            <span style="margin-left:12px;color:#86909c;font-size:12px">日期列：${hasDateCol}</span>
          </div>
          <div style="padding:10px 12px;background:#fff8e8;font-size:12px;color:#8a6d1b">
            识别字段：${[...new Set(colMap.values())].map(k=>MODULES[module]?.fields.find(f=>f.key===k)?.label||k).join('、')}
          </div>
          <table>
            <thead><tr>${[...colMap.entries()].map(([ci,key])=>`<th>${escapeHtml(headers[ci])} → ${MODULES[module]?.fields.find(f=>f.key===key)?.label||key}</th>`).join('')}</tr></thead>
            <tbody>${previewRows}</tbody>
          </table>
          <div style="padding:12px;background:#f2f4f9">
            <button class="btn green" onclick="confirmImport()">✓ 确认导入 ${rows.length} 条数据</button>
            <span style="margin-left:12px;color:#86909c;font-size:12px">导入将追加到现有数据后方</span>
          </div>
        </div>`;

      document.getElementById('importPreview').innerHTML=previewHtml;
      pendingImportData={wb,module,headers,rows,colMap,dateKey};

    } catch(err){
      alert('文件读取失败：'+err.message);
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
}

async function confirmImport(){
  if(!pendingImportData){ alert('无待导入数据'); return; }
  const {module,rows,colMap,dateKey}=pendingImportData;
  const records = [];
  for(const row of rows){
    const dateColIdx=[...colMap.entries()].find(([,k])=>k===dateKey)?.[0];
    if(dateColIdx===undefined) continue;
    const dateVal=row[dateColIdx];
    if(!dateVal||dateVal==='') continue;
    const rec = mapRowToRecord(row, colMap, module);
    records.push(rec);
  }
  if(!records.length){ alert('无可导入的有效记录'); return; }
  try {
    await api('/api/sync/' + (module === 'short_video' ? 'short_video' : module), {
      method:'POST', body: JSON.stringify({ records, mode:'append' })
    });
    await apiLoadAll();
    alert(`导入完成：成功 ${records.length} 条`);
    document.getElementById('importPreview').innerHTML='';
    pendingImportData=null;
  } catch(e){ alert('导入失败：' + e.message); }
}

async function addUser(){
  const username=document.getElementById('newUser').value.trim();
  const display_name=document.getElementById('newUserDisp').value.trim();
  const role=document.getElementById('newUserRole').value;
  const password=document.getElementById('newUserPwd').value;

  if(password.length<6){ alert('密码至少6位'); return; }
  try{
    await api('/api/users',{method:'POST',body:JSON.stringify({username,display_name,role,password})});
    document.getElementById('newUser').value='';
    document.getElementById('newUserDisp').value='';
    document.getElementById('newUserPwd').value='';

  try{ await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({disabled})}); loadUsers(); }catch(e){ alert('失败：'+e.message); }

function backupExport(){
  const data={sv:DB.get('wb_sv'),live:DB.get('wb_live'),leads:DB.get('wb_leads'),staff:DB.get('wb_staff')};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='工作台备份_'+today()+'.json'; a.click();
}
function backupImport(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(!confirm('导入备份将覆盖当前所有数据（仅管理员/主管可执行），确定？')) { input.value=''; return; }
      // 转换字段：live 记录 duration_minutes → duration_hours
      const sv = (d.sv||[]).map(r => ({...r, platforms: Array.isArray(r.platforms)?r.platforms:(r.platforms?[r.platforms]:[])}));
      const live = (d.live||[]).map(r => ({ ...r, duration_hours: Number(r.duration_minutes ?? r.duration_hours) || 0 }));
      const leads = (d.leads||[]);
      await api('/api/sync/short_video', { method:'POST', body: JSON.stringify({ records: sv, mode:'replace' }) });
      await api('/api/sync/live', { method:'POST', body: JSON.stringify({ records: live, mode:'replace' }) });
      await api('/api/sync/leads', { method:'POST', body: JSON.stringify({ records: leads, mode:'replace' }) });
      await apiLoadAll();
      alert('导入成功'); renderTab(document.querySelector('#nav button.active').dataset.tab);
    }catch(err){ alert('导入失败：' + err.message); }
    input.value='';
  };
  reader.readAsText(file);
}
